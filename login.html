<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uni-Biz Hub - Login</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Uni-Biz Hub</a>
            <button class="navbar-toggler navbar-dark" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="category.html">Categories</a></li>
                    <li class="nav-item"><a class="nav-link active" href="login.html">My Account</a></li>
                </ul>
            </div>
        </div>
    </nav>

   
    <div class="container">
        <div class="login-card">
            <h2 class="text-center mb-4 fw-bold">Login</h2>
            
           
            <div class="btn-group w-100 mb-4" role="group">
                <button type="button" class="btn btn-outline-black active" id="buyerTab" onclick="switchRole('buyer')">Buyer Login</button>
                <button type="button" class="btn btn-outline-black" id="sellerTab" onclick="switchRole('seller')">Seller Login</button>
            </div>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="email" class="form-label fw-medium">Email address</label>
                    <input type="email" class="form-control" id="email" placeholder="student@university.ac.lk">
                    <div class="text-danger small mt-1" id="emailError"></div>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label fw-medium">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="Enter password">
                    <div class="text-danger small mt-1" id="passwordError"></div>
                </div>
                <button type="submit" class="btn btn-black w-100 mb-3 py-2 fw-bold">Login</button>
            </form>

            <div class="d-flex justify-content-between text-sm mt-2">
                <a href="#" class="text-decoration-none text-dark small">Forgot Password?</a>
                <a href="#" class="text-decoration-none text-dark small fw-bold">Create an Account</a>
            </div>
        </div>
    </div>

    
    <footer class="text-center">
        <div class="container">
            <p class="m-0 small">&copy; 2026 Uni-Biz Hub. All Rights Reserved.</p>
        </div>
    </footer>

    
    <script>
        function switchRole(role) {
            const buyerTab = document.getElementById('buyerTab');
            const sellerTab = document.getElementById('sellerTab');
            if(role === 'buyer') {
                buyerTab.classList.add('active');
                sellerTab.classList.remove('active');
            } else {
                sellerTab.classList.add('active');
                buyerTab.classList.remove('active');
            }
        }

        
   </script>
    <script src="script.js"></script>
</body>
</html>
